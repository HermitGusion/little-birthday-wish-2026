<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8e7e1">
  <meta name="description" content="数字蜡烛倒数、祝福便利贴组成心形，满屏祝福中绘出生日蛋糕。">
  <title>生日快乐 · 把所有祝福送给你</title>
  <link rel="stylesheet" href="./cartoon-font.css?v=12">
  <link rel="stylesheet" href="./footer-font.css?v=12">
  <link rel="stylesheet" href="./scene-fonts.css?v=9">
  <link rel="stylesheet" href="./style.css?v=21">
  <script src="./script.js?v=18" defer></script>
</head>
<body>
  <div class="app is-ready" id="app">
    <div class="ambient ambient--one" aria-hidden="true"></div>
    <div class="ambient ambient--two" aria-hidden="true"></div>
    <div id="blessing-field" class="blessing-field" aria-hidden="true"></div>
    <main class="experience" id="experience">
      <section class="scene scene--ready is-active" id="scene-ready" aria-labelledby="ready-title">
        <div id="birthday-stream" class="birthday-stream" aria-hidden="true"></div>
        <div class="ready-message"><img class="ready-character" src="./shaosiyuan-chibi.svg" alt="Q版少司缘" width="240" height="270"><h2 id="ready-title">准备好了吗？</h2><button id="start-button" class="button button--primary" type="button">点亮这份生日惊喜 <span aria-hidden="true">↗</span></button></div>
      </section>
      <section class="scene scene--candles" id="scene-candles" aria-labelledby="candle-title" aria-hidden="true" inert>
        <h1 class="hero-title" id="candle-title">把今天的光，<br>留给你。</h1>
        <div class="candle-stage" role="img" aria-label="数字蜡烛依次显示三、二、一，同一时刻只有一根">
          <span class="stage-star stage-star--one" aria-hidden="true">✦</span><span class="stage-star stage-star--two" aria-hidden="true">✳</span><span class="stage-star stage-star--three" aria-hidden="true">✧</span>
          <div class="candle-celebration" aria-hidden="true">
            <span class="candle-spark" style="--x:8%;--y:38%;--s:17px;--d:0s">✧</span><span class="candle-spark" style="--x:28%;--y:9%;--s:13px;--d:.6s">✦</span>
            <span class="candle-spark" style="--x:72%;--y:6%;--s:20px;--d:1.2s">✧</span><span class="candle-spark" style="--x:91%;--y:44%;--s:12px;--d:.9s">✦</span>
            <span class="candle-spark" style="--x:15%;--y:71%;--s:13px;--d:1.6s">✦</span><span class="candle-spark" style="--x:79%;--y:77%;--s:20px;--d:.3s">✧</span>
            <span class="candle-spark" style="--x:33%;--y:90%;--s:12px;--d:1.1s">✧</span><span class="candle-spark" style="--x:64%;--y:91%;--s:10px;--d:1.8s">✦</span>
            <svg class="candle-firework candle-firework--left" viewBox="0 0 80 80"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M40 9v12m0 38v12M9 40h12m38 0h12M18 18l9 9m26 26 9 9M18 62l9-9m26-26 9-9"/><circle cx="40" cy="40" r="3"/></g></svg>
            <svg class="candle-firework candle-firework--right" viewBox="0 0 80 80"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M40 9v12m0 38v12M9 40h12m38 0h12M18 18l9 9m26 26 9 9M18 62l9-9m26-26 9-9"/><circle cx="40" cy="40" r="3"/></g></svg>
          </div>
          <div class="candle-row" aria-hidden="true">
            <div class="number-candle number-candle--three is-current" data-number="3"><span class="flame"></span><span class="wick"></span><span class="wax">3</span></div>
            <div class="number-candle number-candle--two" data-number="2"><span class="flame"></span><span class="wick"></span><span class="wax">2</span></div>
            <div class="number-candle number-candle--one" data-number="1"><span class="flame"></span><span class="wick"></span><span class="wax">1</span></div>
          </div>
          <div class="cake-plate" aria-hidden="true"><span class="cake-plate__top"></span><span class="cake-plate__base"></span></div>
          <div class="stage-caption" aria-hidden="true">烛光亮起，好事将至</div>
        </div>
        <p id="countdown-status" class="sr-only" aria-live="polite"></p>
      </section>

      <section class="scene scene--notes" id="scene-notes" aria-labelledby="notes-title" aria-hidden="true" inert>
        <div class="eyebrow">写给今天的你</div>
        <div class="notes-backdrop"><h2 id="notes-title" class="section-title">生日快乐</h2><p lang="en">Happy Birthday</p></div>
        <p class="scene-intro">这些话，想留给你。</p>
        <div id="heart-board" class="heart-board" aria-label="许多祝福便利贴逐渐拼成的心形">
          <div class="heart-board__glow" aria-hidden="true"></div>
          <div class="heart-board__center"><span>写给特别的你</span><strong>生日快乐 ♡</strong><span class="heart-board__tiny" lang="en">Happy Birthday</span></div>
          <div id="notes-container" class="notes-container"></div>
          <div class="note-reader"><span id="note-reader-label" class="note-reader__label">写给你</span><p id="note-reader-text" aria-live="polite">愿你在新的一岁里，走过的路都有风景，遇见的人都带着善意。</p></div>
          <span class="heart-board__spark heart-board__spark--one" aria-hidden="true">✧</span><span class="heart-board__spark heart-board__spark--two" aria-hidden="true">✦</span>
        </div>
        <button id="next-button" class="button button--outline note-next icon-button" type="button" aria-label="展开全屏祝福" title="展开全屏祝福"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </section>

      <section class="scene scene--bloom" id="scene-bloom" aria-labelledby="bloom-title" aria-hidden="true" inert>
        <h2 id="bloom-title" class="sr-only">祝福便利签绽放，铺满整个屏幕</h2>
        <div id="bloom-board" class="bloom-board"></div>
      </section>

      <section class="scene scene--cake" id="scene-cake" aria-labelledby="cake-title" aria-hidden="true" inert>
        <div class="eyebrow"><span class="eyebrow__line"></span> 千言万语，画成一块生日蛋糕 <span class="eyebrow__line"></span></div>
        <div class="cake-art" role="img" aria-label="在满屏祝福文字之上逐笔绘出的生日蛋糕">
          <span class="cake-art__spark cake-art__spark--a" aria-hidden="true">✦</span><span class="cake-art__spark cake-art__spark--b" aria-hidden="true">✳</span><span class="cake-art__spark cake-art__spark--c" aria-hidden="true">✧</span>
          <svg class="cake-svg" viewBox="0 0 440 360" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <g fill="none" stroke-linecap="round" stroke-linejoin="round">
              <ellipse class="cake-line cake-line--plate" pathLength="1" cx="220" cy="306" rx="180" ry="31" stroke="#f9c7e7" stroke-width="5"/>
              <path class="cake-line cake-line--plate" pathLength="1" d="M40 305v17c0 20 80 33 180 33s180-13 180-33v-17" stroke="#c8b9ff" stroke-width="4"/>
              <path class="cake-line cake-line--body" pathLength="1" d="M85 156v133c0 24 61 43 135 43s135-19 135-43V156" stroke="#b7b4ff" stroke-width="6"/>
              <path class="cake-line cake-line--body" pathLength="1" d="M88 252c70 29 194 30 264 0M88 280c70 29 194 30 264 0" stroke="#ec9cde" stroke-width="4"/>
              <ellipse class="cake-line cake-line--top" pathLength="1" cx="220" cy="160" rx="135" ry="48" stroke="#f9d7ec" stroke-width="6"/>
              <path class="cake-line cake-line--icing" pathLength="1" d="M85 162v29c8 17 17 17 22-1 5-18 13-16 18 4 5 18 15 18 21 0 6-19 15-18 20 3 4 18 15 18 19-2 5-23 17-24 21 0 4 20 17 19 21-1 5-23 17-23 22 0 5 19 16 19 21-1 5-18 15-19 21-1 6 18 16 17 22 0 6-16 14-17 20 1 5 16 15 14 22-3v-28" stroke="#ffb0db" stroke-width="6"/>
              <path class="cake-line cake-line--details" pathLength="1" d="M165 146c29-20 90-25 116-5M181 266q9-10 19 0m41 0q9-10 19 0m-51 16q12 14 25 0" stroke="#ffd9e2" stroke-width="4"/>
              <path class="cake-line cake-line--details" pathLength="1" d="M170 212l6-7m87 11l6-8m-67-3l5-8m30 15l-4 8m-63 22l7-5m85 6l-5 7" stroke="#ffd06e" stroke-width="5"/>
              <path class="cake-line cake-line--candle" pathLength="1" d="M213 120V54h17v66m-17-45h17m-17 19h17M221 52V41" stroke="#ffdc96" stroke-width="5"/>
              <path class="cake-line cake-line--details" pathLength="1" d="M122 120q-15-25 8-28 23-3 15 20m169 4q-7-29 17-24 22 5 8 29" stroke="#ffa9bf" stroke-width="5"/>
              <path class="cake-line cake-line--details" pathLength="1" d="M113 98q-8-15-18-17m233 10q8-14 20-13" stroke="#bbdcb4" stroke-width="4"/>
            </g>
          </svg>
          <span class="cake-art__flame" aria-hidden="true"></span><div id="confetti" class="confetti" aria-hidden="true"></div>
        </div>
        <div class="cake-characters" aria-label="少司缘、朵莉亚和瑶的Q版形象">
          <img src="./shaosiyuan-chibi.svg" alt="Q版少司缘" width="240" height="270">
          <img src="./duoliya-chibi.svg" alt="Q版朵莉亚" width="240" height="270">
          <img src="./yao-chibi.svg" alt="Q版瑶" width="240" height="270">
        </div>
        <div class="cake-message"><span class="script-label">Happy Birthday!</span><h2 id="cake-title" class="final-title"><span id="recipient">傅雪妍</span>，生日快乐<svg class="finger-heart" viewBox="50 20 120 176" role="img" aria-label="手指比心，红色爱心悬在指尖"><path class="finger-heart__heart" d="M113 89C95 77 75 63 75 46c0-13 8-21 18-21 11 0 19 9 23 19 6-10 14-14 23-13 14 1 23 10 23 22 0 16-21 29-49 36Z"/><path class="finger-heart__hand" d="M91 100c2-4 7-5 11-2l19 16c-4-8-2-14 3-16 7-3 13 2 13 11l-1 11c6 7 9 16 9 29 0 26-16 39-39 39-25 0-43-10-48-28-2-8-1-15 4-17 4-2 8 0 11 4-4-8-2-15 3-18 5-3 10 0 13 5-3-9-2-15 3-18 4-3 9-1 13 4l-13-14c-3-3-4-7-1-10Z"/><path class="finger-heart__fold" d="M94 100c7 5 14 12 20 19m-16-12 12 11m13-18c6 6 9 14 10 22m-56 10c4 1 8 5 10 10m-16 2c4 1 8 5 10 9m27-34c6 6 11 13 15 20"/></svg></h2>
          <p id="final-wish" class="final-wish">愿你在新的一岁里，能去见想见的人，去做想做的事。忙的时候记得休息，开心的时候尽情笑。愿你往后的日子，身边有爱，心中有盼，闪闪发光。</p>
          <div class="cake-actions"><button id="replay-button" class="button button--primary icon-button" type="button" aria-label="重新播放生日祝福" title="重新播放生日祝福"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1.5 7M4 4v6h6"/></svg></button></div>
        </div>
      </section>
    </main>
    <footer class="page-footer"><span>岁岁欢喜</span><span id="progress-label">准备好了吗</span></footer>
    <button id="skip-button" class="skip-button" type="button" hidden>跳过动画 →</button>
  </div>
</body>
</html>
